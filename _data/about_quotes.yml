# About 英中句对（唯一编辑位置）。
# 增改一句：复制一项，改 en / zh。不要在 about.md 里贴样式标签。
# tight: true 只给 Benjamin 第 2 句用，让它和第 3 句稍近。

jobs:
  - en: "Again, you can’t connect the dots looking forward; you can only connect them looking backwards."
    zh: "再说一次，你无法预先看清这些点会如何相连；只有回望过去，才能看清它们之间的联系。"
  - en: "So you have to trust that the dots will somehow connect in your future."
    zh: "所以你必须相信，这些点会在你的未来以某种方式连在一起。"
  - en: "You have to trust in something–your gut, destiny, life, karma, whatever."
    zh: "你必须相信某种东西——你的直觉、命运、生活、业力，无论是什么。"

benjamin:
  - en: "For what it’s worth … it’s never too late, or in my case too early, to be whoever you want to be."
    zh: "不管怎样……成为你想成为的人，什么时候都不晚；就我而言，甚至也不算太早。"
  - en: "There’s no time limit."
    zh: "这件事没有时限。"
    tight: true
  - en: "Start whenever you want."
    zh: "你想什么时候开始都可以。"
  - en: "You can change or stay the same."
    zh: "你可以改变，也可以保持原样。"
  - en: "There are no rules to this thing."
    zh: "这件事没有规则。"
  - en: "We can make the best or the worst of it."
    zh: "我们可以把它过成最好的，也可以过成最糟的。"
  - en: "I hope you make the best of it."
    zh: "我希望你把它过成最好的。"
  - en: "I hope you see things that startle you."
    zh: "我希望你看见让你心头一震的事物。"
  - en: "I hope you feel things you never felt before."
    zh: "我希望你感受到从未有过的感受。"
  - en: "I hope you meet people who have a different point of view."
    zh: "我希望你遇见观点与你不同的人。"
  - en: "I hope you live a life you’re proud of, and if you’re not, I hope you have the courage to start all over again."
    zh: "我希望你的人生能让自己引以为傲；如果不能，我希望你有勇气从头再来。"

