---
layout: default
type: post
---
<div class="post">

	<header class="post-header">
		<h1 class="post-title">{{ page.title }}</h1>
		{% include post-ymd.html dated=page %}
		<p class="post-meta">{{ post_ymd }}{% if page.author %} · <a
				href="https://github.com/atschx">{{ page.author }}</a>{% endif %}{% if page.meta %} · {{ page.meta }}{%
			endif %}</p>
	</header>

	<article class="post-content">
		{{ content }}
	</article>

</div>
