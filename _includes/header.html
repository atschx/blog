<header class="site-header">

  <div class="wrapper header-bar">

    <a class="site-title" href="{{ '/' | relative_url }}">
      <span class="site-title__line">write now,</span>
      <span class="site-title__line">think more <span class="site-title__line--aside">(different)</span></span>
    </a>

    <div class="header-tools">
      {% include site-search.html %}

      <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="切换到深色主题" title="切换到深色主题">
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M21 14.3A8.5 8.5 0 0 1 9.7 3 7 7 0 1 0 21 14.3z"></path>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 4.5a1 1 0 0 0 1-1V2a1 1 0 1 0-2 0v1.5a1 1 0 0 0 1 1zm0 15a1 1 0 0 0-1 1V22a1 1 0 1 0 2 0v-1.5a1 1 0 0 0-1-1zM6.05 6.05a1 1 0 0 0 0-1.41L5 3.59A1 1 0 0 0 3.59 5l1.05 1.05a1 1 0 0 0 1.41 0zm11.9 11.9a1 1 0 0 0 0 1.41L19 20.41A1 1 0 1 0 20.41 19l-1.05-1.05a1 1 0 0 0-1.41 0zM4.5 12a1 1 0 0 0-1-1H2a1 1 0 1 0 0 2h1.5a1 1 0 0 0 1-1zm17-1H20a1 1 0 1 0 0 2h1.5a1 1 0 1 0 0-2zM6.05 17.95a1 1 0 0 0-1.41 0L3.59 19A1 1 0 1 0 5 20.41l1.05-1.05a1 1 0 0 0 0-1.41zm11.9-11.9a1 1 0 0 0 1.41 0L20.41 5A1 1 0 1 0 19 3.59l-1.05-1.05a1 1 0 0 0 0 1.41zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"></path>
        </svg>
      </button>

      <nav class="site-nav">
        {% assign current_url = page.url %}
        {% for nav_page in site.pages %}
          {% if nav_page.title and nav_page.exclude_from_nav != true %}
          <a class="page-link" href="{{ nav_page.url | relative_url }}"{% if nav_page.url == current_url %} aria-current="page"{% endif %}>{{ nav_page.title }}</a>
          {% endif %}
        {% endfor %}
      </nav>
    </div>

  </div>

</header>
