<div class="site-search" data-site-search data-search-index="{{ '/search.json' | relative_url }}">
  <form class="site-search__form" role="search" action="{{ '/' | relative_url }}" method="get">
    <label class="site-search__field">
      <span class="visually-hidden">搜索文章</span>
      <svg class="site-search__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input
        id="site-search-input"
        class="site-search__input"
        type="search"
        name="q"
        placeholder="搜索文章"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="搜索文章"
        aria-autocomplete="list"
        aria-controls="site-search-results"
        aria-expanded="false"
        aria-haspopup="listbox">
      <button type="button" class="site-search__clear" data-search-clear hidden aria-label="清除">清除</button>
    </label>
  </form>
  <div class="site-search__results" hidden>
    <div class="site-search__status" data-search-status role="status" aria-live="polite"></div>
    <ul id="site-search-results" class="site-search__list" role="listbox"></ul>
  </div>
</div>
